<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yönetim Paneli — GND Machinery</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://gndmachinery.com/assets/logo-header.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .admin-tab-btn { padding: 10px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-weight: 700; font-size: 14px; }
  .admin-tab-btn.active { background: var(--accent-gradient); color: #fff; border-color: transparent; }
  .admin-card { border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; background: var(--card); }
  .admin-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .admin-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .admin-badge.pending { background: #fff3cd; color: #8a6d00; }
  .admin-badge.live { background: #d4f7dc; color: #146c2e; }
  .admin-badge.rejected { background: #fde2e2; color: #9c1c1c; }
  .admin-row { margin: 4px 0; font-size: 14px; }
  .admin-row b { color: var(--text); }
  .admin-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .admin-actions button { padding: 8px 14px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-size: 13px; }
  .admin-btn-approve { background: #22c55e; color: #fff; }
  .admin-btn-reject { background: #ef4444; color: #fff; }
  .admin-btn-undo { background: #e5e7eb; color: #111; }
  #adminGate { text-align: center; padding: 60px 20px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo"><img src="assets/logo-header.png" width="160" height="160" alt="GND Machinery" /></a>
    <nav class="main-nav">
      <a href="index.html#home" data-tr="Ana Sayfa">Home</a>
    </nav>
    <div class="header-actions">
      <span id="auth-nav-slot" class="auth-nav-slot"></span>
    </div>
    <button type="button" class="nav-toggle" aria-label="Menu">☰</button>
  </div>
</header>

<section class="hero category-hero">
  <div class="hero-inner">
    <h1>Yönetim Paneli</h1>
    <p id="adminWho">Yükleniyor...</p>
  </div>
</section>

<div id="adminGate" style="display:none">
  <p>Bu sayfa sadece yönetici hesabıyla görüntülenebilir.</p>
  <a href="giris.html" class="btn btn-primary">Giriş Yap</a>
</div>

<section id="adminContent" class="categories-section" style="display:none">
  <div class="section-inner">
    <div class="admin-tabs">
      <button type="button" class="admin-tab-btn active" data-tab="pazar">Pazar Talepleri</button>
      <button type="button" class="admin-tab-btn" data-tab="teklif">Teklif Talepleri</button>
    </div>

    <div id="tabPazar">
      <div class="admin-tabs">
        <button type="button" class="admin-tab-btn active" data-filter="bekleyen">Bekleyenler</button>
        <button type="button" class="admin-tab-btn" data-filter="yayinda">Yayında</button>
        <button type="button" class="admin-tab-btn" data-filter="all">Tümü</button>
      </div>
      <div id="pazarList">Yükleniyor...</div>
    </div>

    <div id="tabTeklif" style="display:none">
      <div id="teklifList">Yükleniyor...</div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="section-inner footer-inner">
    <div>© 2026 GND Machinery — GND İş Makineleri Sanayi ve Ticaret A.Ş.</div>
  </div>
</footer>

<script src="js/lib/supabase.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
